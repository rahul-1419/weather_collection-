name: Collect weather

on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 UTC (off-peak minute = fewer delays)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Re-fetch the last N days to fill gaps (max 92). 0 = normal run"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weather-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect (auto back-fills last 3 days)
        env:
          BACKFILL: ${{ github.event.inputs.backfill_days || '0' }}
        run: |
          if [ "$BACKFILL" != "0" ]; then
            python collector.py --backfill-days "$BACKFILL"
          else
            python collector.py
          fi

      - name: Commit data
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      - name: Gap check (fails => GitHub emails you)
        run: python collector.py --check --days 7
